# tmux config for the cockpit's own tmux server (tmux -L cockpit). The user's ~/.tmux.conf is not read.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:RGB"
set -g mouse on
set -g escape-time 0
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g focus-events on
set -g extended-keys on
# let Ghostty send modified keys tmux can tell apart (Shift+Esc is the default queue key)
set -as terminal-features 'xterm-ghostty:extkeys'
set -as terminal-features 'xterm-256color:extkeys'

# no status bar: the queue is the navigation
set -g status off
set -g pane-border-lines heavy
set -g pane-active-border-style "fg=blue"

# The queue binds its keys itself from the cockpit settings (queue_key, default Shift+Esc; Esc confirmation)

# Window/session picker (prefix w / prefix s): only the cockpit session, its queue pinned at index 0 and highlighted;
# background sessions (daemon, cogitator) stay out of the list
bind w choose-tree -Zw -O index -f '#{==:#{session_name},cockpit}' -F '#{?#{==:#{window_name},cockpit},#[fg=blue bold]◆ cockpit,#{window_name}}'
bind s choose-tree -Zw -O index -f '#{==:#{session_name},cockpit}' -F '#{?#{==:#{window_name},cockpit},#[fg=blue bold]◆ cockpit,#{window_name}}'

[package]
name = "cockpit"
version = "0.1.0"
edition = "2021"

[lib]
name = "cockpit"
path = "src/lib.rs"

[[bin]]
name = "cockpit"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.7"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
tokio-stream = "0.1"
futures-util = "0.3"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
